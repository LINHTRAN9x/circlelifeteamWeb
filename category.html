  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const navSearch = document.querySelector('.nav-search');
    const navInput = navSearch?.querySelector('input');
    if (!navSearch || !navInput) return;

    let liveDropdown = document.getElementById('steam-live-dropdown');
    if (!liveDropdown) {
      liveDropdown = document.createElement('div');
      liveDropdown.id = 'steam-live-dropdown';
      liveDropdown.className = 'steam-live-search-dropdown';
      navSearch.appendChild(liveDropdown);
    }

    navInput.addEventListener('focus', (e) => {
      e.stopImmediatePropagation();
      document.getElementById('search-overlay')?.classList.remove('open');
      if (navInput.value.trim()) liveDropdown.classList.add('active');
    }, true);

    let timer;
    navInput.addEventListener('input', () => {
      clearTimeout(timer);
      const q = navInput.value.trim().toLowerCase();
      if (!q) {
        liveDropdown.classList.remove('active');
        liveDropdown.innerHTML = '';
        return;
      }
      timer = setTimeout(async () => {
        if (typeof API === 'undefined') return;
        const games = await API.getGames();
        const matches = games.filter(g =>
          g.title.toLowerCase().includes(q) ||
          (g.titleVi || '').toLowerCase().includes(q) ||
          (g.genre || '').toLowerCase().includes(q)
        ).slice(0, 6);

        if (!matches.length) {
          liveDropdown.innerHTML = `<div class="steam-live-empty">Không tìm thấy kết quả cho "${navInput.value}"</div>`;
        } else {
          liveDropdown.innerHTML = matches.map(g => `
            <a href="/game.html?id=${g.slug}" class="steam-live-item">
              <img src="${g.coverImage || '/logo.png'}" alt="${g.title}">
              <div class="steam-live-info">
                <div class="steam-live-title">${g.title}</div>
                <div class="steam-live-meta">${g.platform || 'PC'} • <span style="color:#a4d007">${g.status || 'Việt Hóa'}</span></div>
              </div>
            </a>
          `).join('');
        }
        liveDropdown.classList.add('active');
      }, 150);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-search')) liveDropdown.classList.remove('active');
    });
  });
</script>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tagSel = document.getElementById('cat-filter-tag');
      const platSel = document.getElementById('cat-filter-platform');
      const statusSel = document.getElementById('cat-filter-status');
      const sortSel = document.getElementById('cat-filter-sort');
      const tagsBar = document.getElementById('steam-popular-tags-bar');
      if (!tagSel || typeof API === 'undefined') return;

      // 1. Lấy toàn bộ game và thống kê tất cả các Tag đang có trong kho
      const allGames = await API.getGames();
      const tagCounts = {};

      allGames.forEach(g => {
        if (g.tags && Array.isArray(g.tags)) {
          g.tags.forEach(t => {
            const cleanTag = t.trim();
            if (cleanTag) {
              tagCounts[cleanTag] = (tagCounts[cleanTag] || 0) + 1;
            }
          });
        }
      });

      // Sắp xếp danh sách Tag: Ưu tiên hiển thị theo bảng chữ cái trong ô Select
      const allUniqueTags = Object.keys(tagCounts).sort((a, b) => a.localeCompare(b, 'vi'));
      tagSel.innerHTML = `<option value="all">Tất Cả Nhãn (${allUniqueTags.length} Tags)</option>` +
        allUniqueTags.map(t => `<option value="${t}">#${t} (${tagCounts[t]})</option>`).join('');

      // Sắp xếp 15 Tag có nhiều game nhất để làm nút bấm nhanh kiểu Steam Pills
      const topTags = Object.keys(tagCounts)
        .sort((a, b) => tagCounts[b] - tagCounts[a])
        .slice(0, 15);

      function renderPopularTagPills(activeTag) {
        if (!tagsBar) return;
        let pillsHTML = `
          <button type="button" class="steam-tag-pill ${activeTag === 'all' ? 'active' : ''}" data-tag="all">
            Tất cả (${allGames.length})
          </button>
        `;
        pillsHTML += topTags.map(t => `
          <button type="button" class="steam-tag-pill ${activeTag === t ? 'active' : ''}" data-tag="${t}">
            #${t} <span style="opacity:0.65;font-size:10px;margin-left:3px;">(${tagCounts[t]})</span>
          </button>
        `).join('');
        tagsBar.innerHTML = pillsHTML;

        // Bấm vào nút Tag nhanh -> Tự động đổi ô Select và lọc ngay
        tagsBar.querySelectorAll('.steam-tag-pill').forEach(btn => {
          btn.addEventListener('click', () => {
            tagSel.value = btn.dataset.tag;
            applyCategoryFilters();
          });
        });
      }

      // 2. Đồng bộ với URL hiện tại (?tag=... hoặc ?platform=...)
      const params = new URLSearchParams(window.location.search);
      const urlPlatform = params.get('platform');
      const urlTag = params.get('tag');

      if (urlPlatform && platSel) platSel.value = urlPlatform;
      if (urlTag && allUniqueTags.includes(urlTag)) {
        tagSel.value = urlTag;
      }

      renderPopularTagPills(tagSel.value);

      // 3. Hàm lọc theo Tag + Hệ máy + Tiến độ và vẽ lại phân trang
      function applyCategoryFilters() {
        const tVal = tagSel.value;
        const pVal = platSel.value;
        const stVal = statusSel.value;
        const soVal = sortSel.value;

        renderPopularTagPills(tVal);

        let filtered = [...allGames];

        // Lọc theo Tag (g.tags)
        if (tVal !== 'all') {
          filtered = filtered.filter(g => g.tags && Array.isArray(g.tags) && g.tags.includes(tVal));
        }

        // Lọc theo Hệ máy
        if (pVal !== 'all') {
          filtered = filtered.filter(g => (g.platform || '').includes(pVal));
        }

        // Lọc theo Tiến độ
        if (stVal === 'done') {
          filtered = filtered.filter(g => g.status && g.status.includes('100%'));
        } else if (stVal === 'wip') {
          filtered = filtered.filter(g => !g.status || !g.status.includes('100%'));
        }

        // Sắp xếp
        if (soVal === 'newest') {
          filtered.sort((a, b) => (b.updatedAt || new Date(b.releaseDate || 0).getTime()) - (a.updatedAt || new Date(a.releaseDate || 0).getTime()));
        } else if (soVal === 'a-z') {
          filtered.sort((a, b) => a.title.localeCompare(b.title));
        } else if (soVal === 'rating') {
          filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        }

        // Cập nhật tiêu đề và số lượng kết quả
        const titleEl = document.getElementById('cat-title');
        const descEl = document.getElementById('cat-desc');
        if (titleEl) {
          titleEl.textContent = tVal !== 'all' ? `Game Có Nhãn: #${tVal}` : (pVal !== 'all' ? `Game ${pVal} Việt Hóa` : 'Tất Cả Game Việt Hóa');
        }
        if (descEl) {
          descEl.textContent = `Tìm thấy ${filtered.length} bản việt hóa phù hợp.`;
        }

        // Cập nhật lại biến phân trang của category.js
        if (typeof catFilteredGames !== 'undefined' && typeof renderCategoryPage === 'function') {
          catFilteredGames = filtered;
          renderCategoryPage(1);
        }
      }

      [tagSel, platSel, statusSel, sortSel].forEach(el => {
        el?.addEventListener('change', applyCategoryFilters);
      });
    });
  </script>
